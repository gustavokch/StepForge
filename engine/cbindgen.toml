language = "C"
pragma_once = true
include_guard = "SEQUENCER_ENGINE_H"
autogen_warning = "/* Auto-generated by cbindgen. Do not edit. */"
tab_width = 4
style = "both"
sys_includes = ["stdint.h", "stddef.h"]
documentation = true

[fn]
args = "auto"

[parse]
# Host-driven render (Phase 0) makes two core-crate scalar structs —
# `HostTransport` and `MidiEvent` — reachable from exported `engine_render`.
# Without parsing the core crate, cbindgen cannot see their fields and emits
# them as incomplete types. `include` whitelists ONLY `sequencer_engine` — no
# other dep crates are parsed (serde/postcard/arc-swap/heapless never reach
# the public ABI). Safe/additive: only types reachable from exported fns are
# emitted, and both structs are pure scalars.
parse_deps = true
include = ["sequencer_engine"]

[export]
# Exclude CoreMIDI/CoreFoundation internals that should not appear in the public header.
# These are implementation details of coremidi.rs and should not be exposed to Swift.
exclude = [
    "MIDIPacket",
    "MIDIPacketList",
    "MIDIReadProc",
    "OSStatus",
    "MIDIPortRef",
    "MIDIEndpointRef",
    "ByteCount",
    "MidiTimeStamp",
    "MIDIClientRef",
    "MIDISend",
    "MIDIPacketListInit",
    "MIDIPacketListAdd",
    "CFStringCreateWithCString",
    "MIDIClientCreate",
    "MIDIOutputPortCreate",
    "MIDIDestinationCreate",
    "MIDISourceCreate",
    "MIDIReceived",
    "MIDIEndpointDispose",
    "MIDIClientDispose",
    "CFRelease",
    "CFTypeRef",
    "CFAllocatorRef",
    "CFStringRef",
]
