language = "C"
pragma_once = true
include_guard = "SEQUENCER_ENGINE_H"
autogen_warning = "/* Auto-generated by cbindgen. Do not edit. */"
tab_width = 4
style = "both"
sys_includes = ["stdint.h", "stddef.h"]
documentation = true

[fn]
args = "auto"

[parse]
# Only emit bindings for the ffi crate itself; core types do not cross the ABI.
parse_deps = false

[export]
# Exclude CoreMIDI/CoreFoundation internals that should not appear in the public header.
# These are implementation details of coremidi.rs and should not be exposed to Swift.
exclude = [
    "MIDIPacket",
    "MIDIPacketList",
    "MIDIReadProc",
    "OSStatus",
    "MIDIPortRef",
    "MIDIEndpointRef",
    "ByteCount",
    "MidiTimeStamp",
    "MIDIClientRef",
    "MIDISend",
    "MIDIPacketListInit",
    "MIDIPacketListAdd",
    "CFStringCreateWithCString",
    "MIDIClientCreate",
    "MIDIOutputPortCreate",
    "MIDIDestinationCreate",
    "MIDISourceCreate",
    "MIDIReceived",
    "MIDIEndpointDispose",
    "MIDIClientDispose",
]
