name: StepForge
options:
  bundleIdPrefix: com.stepforge
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  StepForge:
    type: application
    platform: iOS
    sources:
      - path: StepForge
        excludes:
          - "AudioUnit/StepForgeAudioUnit.swift"
          - "AudioUnit/StepForgeEditorViewController.swift"
          - "AudioUnit/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stepforge.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/../engine/include/sequencer_engine.h"
        USER_HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/include"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/dist"
    dependencies:
      - framework: ../engine/dist/SequencerEngine.xcframework
        embed: false
      - sdk: CoreMIDI.framework
    preBuildScripts:
      - script: 'bash "$SRCROOT/../engine/scripts/build_engine.sh"'
        name: Build Rust Engine
        shell: /bin/sh
  StepForge-macOS:
    type: application
    platform: macOS
    sources:
      - path: StepForge
        excludes:
          - "AudioUnit/StepForgeAudioUnit.swift"
          - "AudioUnit/StepForgeEditorViewController.swift"
          - "AudioUnit/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stepforge.app.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/../engine/include/sequencer_engine.h"
        USER_HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/include"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/dist"
    dependencies:
      - framework: ../engine/dist/SequencerEngine.xcframework
        embed: false
      - sdk: CoreMIDI.framework
      - target: StepForgeAU
    preBuildScripts:
      - script: 'bash "$SRCROOT/../engine/scripts/build_engine.sh"'
        name: Build Rust Engine
        shell: /bin/sh
  StepForgeAU:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stepforge.app.mac.StepForgeAU
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: StepForge/AudioUnit/Info.plist
        CODE_SIGN_ENTITLEMENTS: StepForge/AudioUnit/StepForgeAU.entitlements
        ENABLE_APP_SANDBOX: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/../engine/include/sequencer_engine.h"
        USER_HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/include"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/dist"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
    sources:
      - path: StepForge/AudioUnit
      - path: StepForge/Engine
        excludes:
          - "MidiManager.swift"
          - "EngineLifecycle.swift"
      - path: StepForge/Features
        excludes:
          - "Settings/SettingsSheet.swift"
      - path: StepForge/Theme
      - path: StepForge/Components
      - path: StepForge/Gestures
    dependencies:
      - framework: ../engine/dist/SequencerEngine.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
    preBuildScripts:
      - script: 'bash "$SRCROOT/../engine/scripts/build_engine.sh"'
        name: Build Rust Engine
        shell: /bin/sh
  StepForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StepForgeTests
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/../engine/include/sequencer_engine.h"
        USER_HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/include"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/include"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../engine/dist"
    dependencies:
      - target: StepForge
